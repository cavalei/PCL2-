name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build from complete sources
        shell: pwsh
        run: ./build.ps1
      - name: Regression tests (no PCL binaries required)
        shell: pwsh
        run: ./test.ps1
      - name: Data self-check (payload, versions, signatures)
        shell: pwsh
        run: ./tests/CheckData.ps1
      - name: Record SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PclModpackEnabler.exe -Algorithm SHA256).Hash
          "$hash  PclModpackEnabler.exe" | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PclModpackEnabler
          path: |
            dist/PclModpackEnabler.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PclModpackEnabler
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PclModpackEnabler.exe
            dist/SHA256SUMS.txt
